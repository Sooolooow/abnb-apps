<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABNB Rhyme Drill</title>
<style>
  :root { --bg:#0a0a0a; --steel:#c0c0c0; --accent:#ff3b00; --panel:#141414; --green:#2ecc71; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--steel); font-family:'Inter',system-ui,sans-serif; padding:24px; max-width:640px; }
  h1 { font-size:1.3rem; letter-spacing:.05em; margin-bottom:4px; }
  .sub { color:#666; font-size:.8rem; margin-bottom:20px; }
  .prompt { background:var(--panel); border:1px solid #222; border-radius:12px; padding:20px; margin-bottom:16px; }
  .prompt .q { font-size:1.1rem; color:#fff; margin-bottom:12px; }
  .opts { display:grid; gap:8px; }
  .opt { background:#0d0d0d; border:1px solid #2a2a2a; border-radius:8px; padding:12px 14px; cursor:pointer; font-size:.9rem; transition:.15s; }
  .opt:hover { border-color:var(--accent); }
  .opt.correct { border-color:var(--green); background:#0a1a0a; }
  .opt.wrong { border-color:var(--accent); background:#1a0a0a; }
  .score { font-size:1.6rem; font-weight:700; color:#fff; margin-bottom:8px; }
  .bar { height:6px; background:#1a1a1a; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .bar > div { height:100%; background:var(--accent); transition:.3s; }
</style>
</head>
<body>
  <h1>RHYME DRILL</h1>
  <div class="sub">Training-first · it makes you better, it doesn't write for you</div>
  <div class="bar"><div id="prog" style="width:0%"></div></div>
  <div class="score" id="sc">0 / 0</div>
  <div class="prompt" id="prompt"></div>
<script>
const DRILLS=[
  {q:'Which word rhymes with "struggle"?',o:['Hustle','Muscle','Puzzle','All of these'],a:3,why:'All three share the stressed "uh" vowel — true assonance family.'},
  {q:'Pick the multisyllabic rhyme for "determine":',o:['Return','Concern','Yearn','Surface'],a:1,why:'"Concern" — two syllables, matching stressed vowel.'},
  {q:'Which is an internal rhyme?',o:['I came to claim my name','I came to see the sea','I came to break the day','I came to take the stage'],a:0,why:'"came/claim/name" — internal, not just line-end.'},
  {q:'Best cadence for a fast pocket:',o:['Long words, slow stress','Short words, tight stress','Mixed, no pattern','All spondees'],a:1,why:'Short words with tight stress sit in the pocket.'},
  {q:'Identify the scheme: ABAB CDCD',o:['Couplet','Alternate','Enclosed','Chain'],a:1,why:'Alternating pairs — classic ABAB.'},
];
let i=0, correct=0;
function show(){
  if(i>=DRILLS.length){ document.getElementById('prompt').innerHTML=`<div class="score">Done — ${correct}/${DRILLS.length}</div><div class="sub">Drill again to sharpen.</div><button onclick="location.reload()" style="background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:600;cursor:pointer;margin-top:12px">AGAIN</button>`; return; }
  const d=DRILLS[i];
  document.getElementById('prog').style.width=((i)/DRILLS.length*100)+'%';
  document.getElementById('sc').textContent=`${correct} / ${i}`;
  document.getElementById('prompt').innerHTML=`<div class="q">${d.q}</div><div class="opts">${d.o.map((o,idx)=>`<div class="opt" onclick="pick(${idx})">${o}</div>`).join('')}</div>`;
}
function pick(idx){
  const d=DRILLS[i];
  const opts=document.querySelectorAll('.opt');
  opts.forEach((o,j)=>{ o.style.pointerEvents='none'; if(j===d.a)o.classList.add('correct'); else if(j===idx)o.classList.add('wrong'); });
  if(idx===d.a) correct++;
  setTimeout(()=>{ i++; show(); }, 1200);
}
show();
</script>
</body>
</html>
